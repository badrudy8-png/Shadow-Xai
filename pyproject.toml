[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadow-xai"
version = "0.2.0"
description = "Modular foundation for the Shadow-Xai AI assistant"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Shadow-Xai contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
shadow-xai = "shadow_xai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
